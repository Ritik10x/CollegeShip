<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2647" />
    <meta name="author" content="CollegeShip" />
    <meta name="application-name" content="CollegeShip" />
    <meta name="apple-mobile-web-app-title" content="CollegeShip" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Find the best colleges and university programs in India with CollegeShip. Explore courses, fees, admissions, rankings, reviews, and apply online from one platform."
    />
    <meta
      name="keywords"
      content="CollegeShip, colleges in India, university programs, college admission, courses and fees, B.Tech colleges, MBA programs, college search India, apply to college online, university comparison, career counseling, college reviews India"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://collageship.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collageship.web.app/" />
    <meta property="og:site_name" content="CollegeShip" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="CollegeShip — Discover Colleges, Compare Programs & Apply Online in India" />
    <meta
      property="og:description"
      content="Find the best colleges and university programs in India with CollegeShip. Explore courses, fees, admissions, rankings, reviews, and apply online."
    />
    <meta property="og:image" content="https://collageship.web.app/og-image.png" />
    <meta property="og:image:alt" content="CollegeShip — College discovery and application platform" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CollegeShip — Discover Colleges, Compare Programs & Apply Online in India" />
    <meta
      name="twitter:description"
      content="Explore colleges, compare university programs, read reviews, and apply online with CollegeShip."
    />
    <meta name="twitter:image" content="https://collageship.web.app/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CollegeShip",
        "url": "https://collageship.web.app/",
        "description": "CollegeShip helps students explore colleges, compare university programs, review courses, and apply online in India.",
        "inLanguage": "en-IN",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://collageship.web.app/explore?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <title>CollegeShip — Discover Colleges, Compare Programs & Apply Online in India</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        background: linear-gradient(180deg, #e8f4fc 0%, #cce9f8 45%, #a8daf0 100%);
      }
      #app-splash .app-splash__brand {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 1.85rem;
        font-weight: 800;
        color: #0a2647;
      }
      #app-splash .app-splash__brand span { color: #c9a227; }
      #app-splash .app-splash__tag {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(10, 38, 71, 0.62);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__scene"></div>
      <p class="app-splash__brand">College<span>Ship</span></p>
      <p class="app-splash__tag">Charting your course to college</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
